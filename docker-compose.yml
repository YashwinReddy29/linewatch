# One command: docker compose up --build -d
# Then open http://localhost:${WEB_PORT:-3000}, sign in with ADMIN_PASSWORD, and draw a zone.
#
# Services
#   inference  Roboflow Inference server (CPU). Runs the models locally; no credits used.
#   worker     Python: reads video, calls inference, tracks people, fires incidents into a durable outbox.
#   web        Next.js console + API: login, live view (proxied), review, zones, Roboflow upload jobs.
#   db         Postgres: incidents, zones, reviews, upload jobs, schema_migrations.
#
# Only the console is published, on 127.0.0.1. The worker's port (stream, /metrics) and the
# Inference server stay on the compose network.

services:
  inference:
    image: roboflow/roboflow-inference-server-cpu:${INFERENCE_IMAGE_TAG:-1.8.0}
    restart: unless-stopped
    volumes:
      - inference-cache:/tmp/cache # model weights survive restarts

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: linewatch
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432" # for running the web app or its tests outside Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linewatch -d linewatch"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://linewatch:${POSTGRES_PASSWORD}@db:5432/linewatch
      WORKER_URL: http://worker:8090
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      ROBOFLOW_WORKSPACE: ${ROBOFLOW_WORKSPACE:-}
      ROBOFLOW_PROJECT: ${ROBOFLOW_PROJECT:-}
      UPLOAD_MAX_ATTEMPTS: ${UPLOAD_MAX_ATTEMPTS:-5}
      UPLOAD_BACKOFF_MS: ${UPLOAD_BACKOFF_MS:-2000}
      SITE_NAME: ${SITE_NAME:-Demo site}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - web-data:/data # incident snapshots
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/readyz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    build: ./worker
    restart: unless-stopped
    # Same uid as your WSL/Linux user, so files in ./out stay yours.
    user: "${LINEWATCH_UID:-1000}:${LINEWATCH_GID:-1000}"
    depends_on:
      inference:
        condition: service_started
      web:
        condition: service_healthy
    env_file: .env
    environment:
      # These override .env so the same .env works for local runs and for compose.
      INFERENCE_URL: http://inference:9001
      WEB_URL: http://web:3000
      ZONE_FILE: /app/zone.json
      OUT_DIR: /app/out
      STREAM_PORT: 8090
    volumes:
      - ./samples:/app/samples:ro
      - ./out:/app/out # latency logs + the incident outbox (survives restarts)
    # Time to drain the outbox on `docker compose stop` (DRAIN_SECONDS) before SIGKILL.
    stop_grace_period: 30s

volumes:
  inference-cache:
  db-data:
  web-data:
