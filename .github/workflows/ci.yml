name: CI

on:
  push:
    branches: [main, production-upgrade]
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    name: Worker (lint, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - run: pip install -r requirements.txt -r requirements-dev.txt opencv-python-headless pip-audit
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  web:
    name: Web (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linewatch
          POSTGRES_PASSWORD: linewatch
          POSTGRES_DB: linewatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linewatch" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://linewatch:linewatch@localhost:5432/linewatch_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t linewatch-web web
      - run: docker build -t linewatch-worker worker
      - name: Worker image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id linewatch-worker -u)" != "0"
      - name: Web image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id linewatch-web -u)" != "0"

  e2e:
    name: End to end (compose db + web, ingest, outage drill)
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write a CI .env
        run: |
          cp .env.example .env
          sed -i "s/^WORKER_TOKEN=.*/WORKER_TOKEN=$(openssl rand -hex 24)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=$(openssl rand -hex 12)/" .env
          sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^ROBOFLOW_API_KEY=.*/ROBOFLOW_API_KEY=ci-unused/" .env
      - run: docker compose config --quiet
      - name: Start db + web (the Inference server isn't needed for these checks)
        run: WEB_PORT=3200 DB_PORT=5440 docker compose -p linewatch-bench up -d --build --wait db web
      - run: pip install requests python-dotenv numpy opencv-python-headless prometheus-client
      - name: Readiness, auth and security headers
        run: |
          curl -fsS http://localhost:3200/api/readyz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3200/api/incidents)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3200/api/incidents)" = 401
          curl -sI http://localhost:3200/login | grep -qi "content-security-policy"
      - name: Ingest with a retry storm (each incident sent 3 times)
        run: python bench/ingest_load.py --web http://localhost:3200 --incidents 60 --duplicates 3 --concurrency 6 --warmup 5
      - name: Outage drill (stop web, fire incidents, restart)
        run: python bench/outage_drill.py --web http://localhost:3200 --incidents 20 --down-seconds 8
      - if: failure()
        run: docker compose -p linewatch-bench logs web db
